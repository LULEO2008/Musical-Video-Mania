<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Musical Video Mania</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="deck-shell" aria-label="Musical Video Mania presentation">
      <div id="slide-stage" class="slide-stage"></div>

      <nav class="deck-controls" aria-label="Presentation controls">
        <button class="icon-button" id="prev-slide" type="button" aria-label="Previous slide" title="Previous slide">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="slide-counter" id="slide-counter">01 / 15</div>
        <button class="icon-button" id="next-slide" type="button" aria-label="Next slide" title="Next slide">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="print-button" id="print-deck" type="button" aria-label="Print or export deck">Export</button>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
